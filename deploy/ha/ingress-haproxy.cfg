global
  log stdout format raw local0
  maxconn 512

defaults
  mode http
  log global
  timeout connect 5s
  timeout client 60s
  timeout server 60s
  timeout tunnel 1h
  timeout http-request 15s

resolvers docker
  nameserver embedded 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 10s

frontend ingress
  bind :8080
  acl internal_host hdr(host) -i origin origin:8080
  acl readiness_path path -i /_ha/ready
  acl api_available nbsrv(api_origin) gt 0
  acl web_available nbsrv(web_origin) gt 0
  http-request return status 200 content-type text/plain string ready if internal_host readiness_path api_available web_available
  http-request return status 503 content-type text/plain string unavailable if internal_host readiness_path
  acl canary hdr(host) -i tunnel-check.pointfinder.ch tunnel-check.pointfinder.pt
  acl api_host hdr(host) -i api.pointfinder.ch api.pointfinder.pt
  acl web_host hdr(host) -i pointfinder.ch www.pointfinder.ch pointfinder.pt www.pointfinder.pt
  acl canary_api path -i /api-health
  acl canary_web path -i /frontend-check
  acl canary_root path -i /
  acl safe_method method GET HEAD
  http-request set-var(txn.canary) bool(true) if canary
  http-request deny deny_status 405 if canary !safe_method
  http-request return status 200 content-type text/plain string tunnel-ready if canary canary_root
  http-request deny deny_status 404 if !canary !api_host !web_host
  http-request deny deny_status 404 if canary !canary_api !canary_web
  http-request set-header X-Forwarded-Proto https
  http-request set-header X-Forwarded-Port 443
  http-response set-header X-PointFinder-Ingress %[env(PF_EDGE_NODE)] if { var(txn.canary) -m bool }
  http-response set-header Cache-Control no-store if { var(txn.canary) -m bool }
  use_backend canary_api_origin if canary canary_api
  use_backend canary_web_origin if canary canary_web
  use_backend api_origin if api_host
  default_backend web_origin

backend api_origin
  option httpchk GET /actuator/health
  http-check expect status 200
  server-template app 4 tasks.pointfinder-backend-v4djml:8080 check inter 3s fall 3 rise 2 resolvers docker init-addr libc,none

backend web_origin
  option httpchk GET /
  http-check expect status 200
  server-template app 4 tasks.pointfinder-frontend-fvq5ug:80 check inter 3s fall 3 rise 2 resolvers docker init-addr libc,none

backend canary_api_origin
  http-request set-path /actuator/health
  http-request set-header Host api.pointfinder.ch
  option httpchk GET /actuator/health
  http-check expect status 200
  server-template app 4 tasks.pointfinder-backend-v4djml:8080 check inter 3s fall 3 rise 2 resolvers docker init-addr libc,none

backend canary_web_origin
  http-request set-path /
  http-request set-header Host pointfinder.ch
  option httpchk GET /
  http-check expect status 200
  server-template app 4 tasks.pointfinder-frontend-fvq5ug:80 check inter 3s fall 3 rise 2 resolvers docker init-addr libc,none
