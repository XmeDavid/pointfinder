version: "3.8"
services:
  rehearsal-primary:
    image: pointfinder-patroni:16.15-4.1.5-r2
    environment:
      PATRONI_NAME: rehearsal-rainer
      PATRONI_ADDRESS: rehearsal-primary
      ADOPT_ONLY: "true"
    secrets:
      - patroni_auth
    volumes:
      - rehearsal-primary:/var/lib/postgresql/data
    networks: [quorum]
    stop_grace_period: 60s
    deploy:
      # Replaced by the host-specific Dokploy Compose service with watchdog access.
      replicas: 0
      endpoint_mode: dnsrr
      placement:
        constraints: ["node.hostname == pointfinder-ha"]
      resources:
        limits: {memory: 512M, cpus: "1.0"}
      restart_policy: {delay: 10s}
      update_config: {order: stop-first}
  rehearsal-standby:
    image: pointfinder-patroni:16.15-4.1.5-r4
    environment:
      PATRONI_NAME: rehearsal-arthur
      PATRONI_ADDRESS: rehearsal-standby
    secrets:
      - patroni_auth
      - etcd_auth
    volumes:
      - rehearsal-standby:/var/lib/postgresql/data
    networks:
      quorum: {}
      clients:
        aliases: [rehearsal-standby]
    stop_grace_period: 60s
    deploy:
      # Initial adoption was verified before enabling this physical standby.
      replicas: 0
      endpoint_mode: dnsrr
      placement:
        constraints: ["node.hostname == arthur"]
      resources:
        limits: {memory: 512M, cpus: "1.0"}
      restart_policy: {delay: 10s}
      update_config: {order: stop-first}
networks:
  clients:
    external: true
    name: pointfinder-ha-clients
  quorum:
    external: true
    name: pointfinder-quorum-ltydfj_database-tailscale
volumes:
  rehearsal-primary:
    external: true
    name: pointfinder-patroni-rehearsal-primary
  rehearsal-standby:
secrets:
  etcd_auth:
    external: true
    name: pointfinder-etcd-rehearsal-v1
  patroni_auth:
    external: true
    name: pointfinder-patroni-rehearsal-auth-v1
