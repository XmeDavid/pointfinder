services:
  teamspeak3:
    image: pointfinder-teamspeak3-runtime:preserved-20260910-r1
    restart: unless-stopped
    user: "999:987"
    volumes:
      - /etc/dokploy/teamspeak3/data:/teamspeak/teamspeak3-server_linux_amd64
    ports:
      - "9987:9987/udp"
      - "30033:30033/tcp"
      # Administrative query endpoints stay private on Tailscale.
      - "100.113.30.54:10011:10011/tcp"
      - "100.113.30.54:10022:10022/tcp"
      - "100.113.30.54:10080:10080/tcp"
    mem_limit: 256m
    cpus: 0.5
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
