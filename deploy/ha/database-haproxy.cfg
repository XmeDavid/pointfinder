global
    log stdout format raw local0
    maxconn 256
defaults
    log global
    mode tcp
    timeout connect 3s
    timeout client 1h
    timeout server 1h
    timeout check 3s
frontend postgres
    bind *:5432
    default_backend primary
resolvers docker
    nameserver embedded 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s
backend primary
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 2s fall 3 rise 2 on-marked-down shutdown-sessions
    server hetzner patroni-hetzner:5432 check port 8008 resolvers docker init-addr last,libc,none
    server rainer patroni-rainer:5432 check port 8008 resolvers docker init-addr last,libc,none
