# Isolated, disposable local design data. Never points at the deployed database.
name: pointfinder-design
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: pointfinder
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: design-local-only
    volumes:
      - design_db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U scout -d pointfinder]
      interval: 3s
      timeout: 3s
      retries: 20
  storage:
    image: minio/minio:RELEASE.2023-09-04T19-57-37Z
    command: server /data
    ports:
      - '8190:9000'
    environment:
      MINIO_ROOT_USER: pointfinder-local
      MINIO_ROOT_PASSWORD: pointfinder-local-storage-only
    volumes:
      - design_files:/data
  backend:
    build: ./backend
    ports:
      - '127.0.0.1:8188:8080'
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pointfinder?stringtype=unspecified
      SPRING_DATASOURCE_USERNAME: scout
      SPRING_DATASOURCE_PASSWORD: design-local-only
      JWT_SECRET: local-design-only-jwt-secret-at-least-256-bits-long
      FRONTEND_URL: http://localhost:5188
      CORS_ORIGINS: http://localhost:5188,http://127.0.0.1:5188,http://192.168.0.212:5188,http://localhost:5189,http://127.0.0.1:5189
      STORAGE_TYPE: s3
      S3_ENDPOINT: http://${PF_DESIGN_HOST:-192.168.0.212}:8190
      S3_REGION: us-east-1
      S3_BUCKET: pointfinder-design
      S3_ACCESS_KEY: pointfinder-local
      S3_SECRET_KEY: pointfinder-local-storage-only
      MAIL_ENABLED: 'false'
      MANAGEMENT_HEALTH_MAIL_ENABLED: 'false'
      APNS_ENABLED: 'false'
      FCM_ENABLED: 'false'
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx1200m
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  design_db:
  design_files:
