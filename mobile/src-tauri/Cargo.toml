[package]
name = "pointfinder-mobile"
version = "1.0.0"
description = "PointFinder mobile app for players and operators"
authors = ["David Batista"]
edition = "2021"

[lib]
name = "mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-pointfinder-nfc = { path = "../../packages/tauri-plugin-pointfinder-nfc" }
tauri-plugin-pointfinder-push = { path = "../../packages/tauri-plugin-pointfinder-push" }
tauri-plugin-pointfinder-secure-store = { path = "../../packages/tauri-plugin-pointfinder-secure-store" }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-websocket = "2"
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-geolocation = "2"
tauri-plugin-barcode-scanner = "2"
