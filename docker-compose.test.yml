services:
  backend-test:
    image: eclipse-temurin:21-jdk
    working_dir: /workspace/backend
    command: ./gradlew test --no-daemon
    mem_limit: 2g
    cpus: 2
    volumes:
      - ./backend:/workspace/backend
      - ./contract-snapshots:/workspace/contract-snapshots
      - /var/run/docker.sock:/var/run/docker.sock
      - gradle-cache:/root/.gradle

  frontend-test:
    image: oven/bun:1-alpine
    working_dir: /workspace
    command: sh -lc "bun install --frozen-lockfile && bun run --cwd web test"
    mem_limit: 3g
    cpus: 2
    environment:
      CI: "true"
    volumes:
      - .:/workspace
      - bun-cache:/root/.bun
      - workspace-node-modules:/workspace/node_modules
      - web-node-modules:/workspace/web/node_modules
      - mobile-node-modules:/workspace/mobile/node_modules

volumes:
  gradle-cache:
  bun-cache:
  workspace-node-modules:
  web-node-modules:
  mobile-node-modules:
