name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  # Manual runs execute the full test suite. They never skip or bypass tests;
  # on master they publish images and (if deployment is enabled) release them.
  workflow_dispatch:

# A newer push to the same PR supersedes that PR's running checks. Every other
# event (pushes to master) gets a unique group, so master runs stay independent
# and are never cancelled or replaced while pending.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('backend/**/*.gradle.kts') }}
          restore-keys: gradle-

      - name: Run backend tests
        working-directory: backend
        run: ./gradlew test --no-daemon

  # Static checks and unit tests for the Bun workspace. Nothing here needs a
  # browser or a production bundle, so it runs alongside the e2e shards.
  web-checks:
    name: Web Lint, Typecheck & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run --cwd web lint
      - run: bun run --cwd web typecheck
      - run: bun run --filter "@pointfinder/*" typecheck
      - run: make design-system-check
      - run: bun run --cwd web test
      - run: bun run --cwd packages/api test
      - run: bun run --cwd packages/game-core test
      - run: bun run --cwd packages/i18n test
      - run: bun run --cwd web build-storybook

  # Playwright suite (browser + native-shell projects, including the WebGL
  # onboarding scenes) split into a bounded number of shards. Each shard builds
  # both bundles itself: a rebuild is ~40s, cheaper and simpler than passing
  # dist/ and dist-native/ through artifacts and a serial build job.
  web-e2e:
    name: Web E2E (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run build:native
      - run: cd web && bun x playwright install --with-deps chromium

      - name: Run Playwright shard
        # The divisor must equal the number of entries in matrix.shard above.
        run: cd web && bun run test:e2e --shard=${{ matrix.shard }}/4

      - name: Upload Playwright traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-shard-${{ matrix.shard }}
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # Proves the production web image still builds from the workspace.
  web-docker:
    name: Web Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f web/Dockerfile -t pointfinder-web:ci .

  # Compiles the Tauri shell for the desktop target and runs its Rust tests,
  # so a change to mobile/src-tauri or a tauri-plugin-pointfinder-* crate
  # cannot land broken. Device builds (signing, SDKs) stay local; see
  # docs/native-platform-validation.md.
  mobile-shell:
    name: Mobile Shell (Tauri)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mobile/src-tauri

      - run: bun install --frozen-lockfile

      # tauri::generate_context! embeds web/dist-native at compile time.
      - run: bun run build:native

      - run: cargo test --manifest-path mobile/src-tauri/Cargo.toml --locked

  # Aggregate of the web jobs above. Keeps the original job id and check name
  # so branch protection, the deploy gate and external status consumers keep
  # working. Fails unless every web job succeeded (skipped/cancelled count as
  # failure).
  frontend:
    name: Frontend Lint & Tests
    runs-on: ubuntu-latest
    needs: [web-checks, web-e2e, web-docker, mobile-shell]
    if: always()
    steps:
      - name: Check web job results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          failed=0
          for result in $(echo "$RESULTS" | jq -r '.[].result'); do
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "One or more web jobs did not succeed."
            exit 1
          fi

  android:
    name: Android Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-gradle-${{ hashFiles('android-app/**/*.gradle.kts') }}
          restore-keys: android-gradle-

      - name: Run Android unit tests
        run: android-app/gradlew -p android-app :core:model:test :core:data:test :core:network:test :app:assembleDebug

  # Temporarily disabled during the deployment/refactor workstream. Re-enable
  # this job once the local E2E stack is stable enough to gate production.
  # e2e-smoke:

  # Immutable release images. Only a master run in which every test gate
  # (backend, frontend, android) succeeded may publish. Each job publishes one
  # linux/amd64 image to GHCR with OCI revision labels and exposes the pushed
  # manifest digest, which is the only thing the deploy workflow accepts.
  backend-image:
    name: Publish Backend Image
    runs-on: ubuntu-latest
    needs: [backend, frontend, android]
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/master' &&
      needs.backend.result == 'success' &&
      needs.frontend.result == 'success' &&
      needs.android.result == 'success'
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/pointfinder-backend" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=ref,event=branch
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=pointfinder-backend

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          # Plain image manifest, so the digest below identifies exactly one
          # linux/amd64 image rather than an attestation index.
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Verify immutable digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if ! printf '%s' "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "Build did not produce a sha256 digest: '$DIGEST'"
            exit 1
          fi
          echo "Published ${{ steps.image.outputs.name }}@$DIGEST"

  frontend-image:
    name: Publish Frontend Image
    runs-on: ubuntu-latest
    needs: [backend, frontend, android]
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/master' &&
      needs.backend.result == 'success' &&
      needs.frontend.result == 'success' &&
      needs.android.result == 'success'
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/pointfinder-frontend" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=ref,event=branch
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=pointfinder-frontend

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          # web/Dockerfile expects the repository root as its context.
          context: .
          file: web/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Verify immutable digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if ! printf '%s' "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "Build did not produce a sha256 digest: '$DIGEST'"
            exit 1
          fi
          echo "Published ${{ steps.image.outputs.name }}@$DIGEST"

  # Deployment only ever receives digests produced above, so nothing reaches
  # production that was not built from a fully green master run. The reusable
  # workflow additionally stays paused until the repository variable
  # POINTFINDER_DEPLOY_ENABLED is set to "true".
  deploy:
    name: Deploy
    needs: [backend-image, frontend-image]
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/master' &&
      needs.backend-image.result == 'success' &&
      needs.frontend-image.result == 'success'
    uses: ./.github/workflows/deploy.yml
    with:
      backend_image: ${{ needs.backend-image.outputs.image }}
      backend_digest: ${{ needs.backend-image.outputs.digest }}
      frontend_image: ${{ needs.frontend-image.outputs.image }}
      frontend_digest: ${{ needs.frontend-image.outputs.digest }}
      revision: ${{ github.sha }}
    secrets: inherit
