name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('backend/**/*.gradle.kts') }}
          restore-keys: gradle-

      - name: Run backend tests
        working-directory: backend
        run: ./gradlew test --no-daemon

  frontend:
    name: Frontend Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: cd web && bun run lint
      - run: cd web && bun run typecheck
      - run: cd web && bun run test
      - run: bun run build
      - run: bun run build:native
      - run: bun run --filter "@pointfinder/*" typecheck
      - run: make design-system-check
      - run: bun run --cwd web build-storybook
      - run: cd web && bun x playwright install --with-deps chromium
      - run: bun run --cwd web test:e2e
      - run: bun run --cwd packages/api test
      - run: bun run --cwd packages/game-core test
      - run: bun run --cwd packages/i18n test
      - run: docker build -f web/Dockerfile -t pointfinder-web:ci .

  android:
    name: Android Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-gradle-${{ hashFiles('android-app/**/*.gradle.kts') }}
          restore-keys: android-gradle-

      - name: Run Android unit tests
        run: android-app/gradlew -p android-app :core:model:test :core:data:test :core:network:test :app:assembleDebug

  # Temporarily disabled during the deployment/refactor workstream. Re-enable
  # this job once the local E2E stack is stable enough to gate production.
  # e2e-smoke:

  deploy:
    name: Deploy
    needs: [backend, frontend, android]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      (
        (
          needs.backend.result == 'success' &&
          needs.frontend.result == 'success' &&
          needs.android.result == 'success'
        ) ||
        vars.DOKPLOY_DEPLOY_WITH_FAILED_CI == 'true'
      )
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
