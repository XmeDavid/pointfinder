[package]
name = "tauri-plugin-pointfinder-push"
version = "0.1.0"
authors = [ "David Batista" ]
description = "Push notifications (APNs and FCM) for PointFinder"
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-pointfinder-push"

[dependencies]
tauri = { version = "2.11.3" }
serde = "1.0"
serde_json = "1"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }
