[package]
name = "tauri-plugin-pointfinder-device"
version = "0.1.0"
authors = [ "David Batista" ]
description = "Native sharing and lifecycle events for PointFinder"
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-pointfinder-device"

[dependencies]
tauri = { version = "2.11.3" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }
