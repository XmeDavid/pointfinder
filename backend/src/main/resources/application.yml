spring:
  application:
    name: pointfinder

  jackson:
    serialization:
      write-dates-as-timestamps: false

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  # NOTE: spring.datasource.url, username, and password are NOT defined here.
  # They MUST be provided via environment variables (SPRING_DATASOURCE_URL,
  # SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD) or via a
  # profile-specific application-{profile}.yml. The Docker Compose files and
  # CI workflows set these through their respective environment blocks.
  # See docs/infrastructure.md for the full list of required env vars.
  datasource:
    hikari:
      maximum-pool-size: 20
      connection-timeout: 5000
      leak-detection-threshold: 10000

  lifecycle:
    timeout-per-shutdown-phase: 30s

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  mail:
    host: ${MAIL_HOST:smtp.resend.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:resend}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080
  shutdown: graceful

app:
  jwt:
    secret: ${JWT_SECRET:scout-mission-dev-secret-key-that-is-at-least-256-bits-long-for-hs256}
    # Hard-fail on startup if the insecure default secret is in use, on ANY
    # profile. For local development only, set JWT_ALLOW_INSECURE=true to run
    # with the default secret without configuring JWT_SECRET. Any deployed
    # environment MUST leave this false (the default) and supply a real
    # JWT_SECRET.
    allow-insecure: ${JWT_ALLOW_INSECURE:false}
    access-token-expiration-ms: 900000       # 15 minutes
    refresh-token-expiration-ms: 604800000   # 7 days
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:info@pointfinder.pt}
    enabled: ${MAIL_ENABLED:false}
  apns:
    enabled: ${APNS_ENABLED:false}
    # Default to the Apple key filename convention used in the mounted secrets folder.
    key-path: ${APNS_KEY_PATH:file:/app/config/AuthKey_${APNS_KEY_ID:}.p8}
    key-id: ${APNS_KEY_ID:}
    team-id: ${APNS_TEAM_ID:}
    bundle-id: ${APNS_BUNDLE_ID:}
    production: ${APNS_PRODUCTION:false}
  fcm:
    enabled: ${FCM_ENABLED:false}
    credentials-path: ${FCM_CREDENTIALS_PATH:}
    project-id: ${FCM_PROJECT_ID:}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    prices:
      individual-pro-monthly: ${STRIPE_PRICE_PRO_MONTHLY:}
      individual-pro-annual: ${STRIPE_PRICE_PRO_ANNUAL:}
    success-url: ${FRONTEND_URL:http://localhost:5173}/billing/success
    cancel-url: ${FRONTEND_URL:http://localhost:5173}/billing/cancel
  quota:
    enforcement-enabled: ${QUOTA_ENFORCEMENT_ENABLED:false}
  storage:
    type: ${STORAGE_TYPE:local}  # "local" or "s3"
    s3:
      endpoint: ${S3_ENDPOINT:}
      region: ${S3_REGION:eu-central-1}
      bucket: ${S3_BUCKET:}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      presign-expiry-seconds: ${S3_PRESIGN_EXPIRY_SECONDS:3600}
  uploads:
    path: ${APP_UPLOADS_PATH:/uploads}
    max-file-size-bytes: ${APP_UPLOADS_MAX_FILE_SIZE_BYTES:2147483648}
    # How old a completed-but-unlinked upload session must be before the
    # needs-attention detector alerts on it (ALERT-ONLY, never deletes data).
    needs-attention-threshold-minutes: ${APP_UPLOADS_NEEDS_ATTENTION_THRESHOLD_MINUTES:15}
    chunk:
      enabled: ${APP_UPLOADS_CHUNK_ENABLED:true}
      # auto (S3 when storage type is s3, else local) | s3 | local. Two active
      # backends need s3 or a shared upload volume.
      store: ${APP_UPLOADS_CHUNK_STORE:auto}
      default-size-bytes: ${APP_UPLOADS_CHUNK_DEFAULT_SIZE_BYTES:8388608}
      max-size-bytes: ${APP_UPLOADS_CHUNK_MAX_SIZE_BYTES:16777216}
      session-ttl-seconds: ${APP_UPLOADS_CHUNK_SESSION_TTL_SECONDS:86400}
    limits:
      max-active-sessions-per-player: ${APP_UPLOADS_MAX_ACTIVE_SESSIONS_PER_PLAYER:3}
      max-active-bytes-per-game: ${APP_UPLOADS_MAX_ACTIVE_BYTES_PER_GAME:17179869184}
    # Local, bounded scratch space used to assemble chunks at completion and
    # to render thumbnails; never shared between instances.
    temp-path: ${APP_UPLOADS_TEMP_PATH:${java.io.tmpdir}/pointfinder-assembly}
  # Identity of this process for job leases, presence rows and outbox rows.
  # Defaults to the container hostname. Two replicas must not share a value.
  instance-id: ${APP_INSTANCE_ID:}
  # Two-active-backend coordination. Every default is safe for one instance;
  # see docs/ha-application-readiness.md for the rollout gates.
  ha:
    outbox:
      enabled: ${APP_HA_OUTBOX_ENABLED:true}
      listen-enabled: ${APP_HA_OUTBOX_LISTEN_ENABLED:true}
      poll-interval-ms: ${APP_HA_OUTBOX_POLL_INTERVAL_MS:1000}
      batch-size: ${APP_HA_OUTBOX_BATCH_SIZE:500}
      retention-minutes: ${APP_HA_OUTBOX_RETENTION_MINUTES:10}
      cursor-retention-hours: ${APP_HA_OUTBOX_CURSOR_RETENTION_HOURS:24}
    presence:
      store: ${APP_HA_PRESENCE_STORE:db}          # db | memory
      heartbeat-interval-ms: ${APP_HA_PRESENCE_HEARTBEAT_INTERVAL_MS:15000}
      ttl-seconds: ${APP_HA_PRESENCE_TTL_SECONDS:45}
    rate-limit:
      store: ${APP_HA_RATE_LIMIT_STORE:db}        # db | memory
      retention-hours: ${APP_HA_RATE_LIMIT_RETENTION_HOURS:24}
    jobs:
      coordinated: ${APP_HA_JOBS_COORDINATED:true}
      default-lease-seconds: ${APP_HA_JOBS_DEFAULT_LEASE_SECONDS:120}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
